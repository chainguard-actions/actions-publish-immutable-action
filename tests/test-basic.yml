name: Test basic usage (default token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran (published, or failed gracefully under harness)
        env:
          RESULT: ${{ steps.action.outputs.package-manifest-sha }}
          ATTEST: ${{ steps.action.outputs.attestation-manifest-sha }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "package-manifest-sha: $RESULT"
          echo "attestation-manifest-sha: $ATTEST"
          if [ "$OUTCOME" = "success" ]; then
            case "$RESULT" in
              sha256:*) echo "PASS: got '$RESULT'" ;;
              *) echo "FAIL: action succeeded but package-manifest-sha is not a sha256 digest"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set package-manifest-sha"
              exit 1
            fi
            echo "PASS: action failed gracefully (non-tag ref / sentinel repo under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
