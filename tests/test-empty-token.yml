name: Test empty github-token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ''
      - name: Assert action failed without publishing
        env:
          RESULT: ${{ steps.action.outputs.package-manifest-sha }}
          ATTEST: ${{ steps.action.outputs.attestation-manifest-sha }}
          REFIDX: ${{ steps.action.outputs.referrer-index-manifest-sha }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "package-manifest-sha: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT" ] || [ -n "$ATTEST" ] || [ -n "$REFIDX" ]; then
            echo "FAIL: outputs should be empty on failure"
            exit 1
          fi
          echo "PASS"
