name: Test empty github-token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ''
      - name: Assert action failed and produced no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PKG: ${{ steps.action.outputs.package-manifest-sha }}
          ATT: ${{ steps.action.outputs.attestation-manifest-sha }}
          REF: ${{ steps.action.outputs.referrer-index-manifest-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "package-manifest-sha: $PKG"
          echo "attestation-manifest-sha: $ATT"
          echo "referrer-index-manifest-sha: $REF"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with empty token, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$PKG" ] || [ -n "$ATT" ] || [ -n "$REF" ]; then
            echo "FAIL: expected no outputs on failure"
            exit 1
          fi
          echo "PASS"
